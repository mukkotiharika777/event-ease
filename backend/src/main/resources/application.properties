server.port=8080

# Application Identity
spring.application.name=EventEase Backend

# Database Configuration (Persistent Local Database with H2 Engine & PostgreSQL Compatibility Mode)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/eventease;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# CORS Configuration
eventease.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
